name: Build and Deploy

on:
    push:
        branches:
            - master
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build project
              run: npm run build

            - name: Create deployment package
              run: |
                  mkdir -p deploy/.next
                  cp -r .next/standalone deploy/
                  cp -r .next/static deploy/.next/static
                  cp -r public deploy/public
                  tar -czf deploy.tar.gz -C deploy .

            - name: Deploy to server via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT || 22 }}
                  script: |
                      mkdir -p ${{ secrets.DEPLOY_PATH }}
                      cd ${{ secrets.DEPLOY_PATH }}

                      # Stop the application if running
                      pm2 stop iamhasani || true

                      # Backup current deployment
                      if [ -d "current" ]; then
                        rm -rf backup
                        mv current backup
                      fi

                      # Create new deployment directory
                      mkdir -p current

            - name: Copy files to server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT || 22 }}
                  source: "deploy.tar.gz"
                  target: ${{ secrets.DEPLOY_PATH }}

            - name: Extract and start application
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT || 22 }}
                  script: |
                      cd ${{ secrets.DEPLOY_PATH }}
                      tar -xzf deploy.tar.gz -C current
                      rm deploy.tar.gz

                      cd current

                      # Start the standalone server with PM2
                      PORT=${PORT:-3000} NODE_ENV=production pm2 start .next/standalone/server.js --name "iamhasani" --update-env
                      pm2 save

                      # Show status
                      pm2 status
